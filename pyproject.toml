[project]
name = "physsplatlab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # PyTorch — CUDA 12.8, sm_120 (RTX 5090 Blackwell) support added in 2.8
    "torch>=2.8.0",
    "torchvision",
    "torchaudio",
    # gaussian-splatting deps
    "plyfile",
    "tqdm",
    "opencv-python",
    "joblib",
    # warp-mpm deps (1.x adds CUDA 12.x + Blackwell support)
    "h5py",
    "warp-lang==1.10.1",
    "imageio[ffmpeg]",
    # required by CUDA extension build scripts (used with --no-build-isolation)
    "setuptools",
    "matplotlib>=3.10.8",
    "scipy>=1.17.1",
    "rasterio>=1.4.4",
]

# NOTE: gaussian-splatting CUDA extensions (diff-gaussian-rasterization,
# simple-knn, fused-ssim) are NOT listed here — they import torch at build
# time and must be installed after torch via: make install  or  ./install.sh

[tool.setuptools.packages.find]
include = ["physsplatlab*"]

[tool.uv.sources]
# x86_64 (lambda, RTX 5090 sm_120) -> CUDA 12.8; aarch64 (TACC Vista, GH200 sm_90) -> CUDA 12.6
torch = [
    { index = "pytorch-cu128", marker = "platform_machine == 'x86_64'" },
    { index = "pytorch-cu126", marker = "platform_machine == 'aarch64'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "platform_machine == 'x86_64'" },
    { index = "pytorch-cu126", marker = "platform_machine == 'aarch64'" },
]
torchaudio = [
    { index = "pytorch-cu128", marker = "platform_machine == 'x86_64'" },
    { index = "pytorch-cu126", marker = "platform_machine == 'aarch64'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
